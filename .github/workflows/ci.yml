name: CI

# Repo privado: minutos de Actions limitados. En cada push y PR va la matriz corta
# (PHP 8.3 y WordPress actual); la completa, al ejecutarlo a mano o al etiquetar una versión.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', '.wordpress-org/**']
  pull_request:
    paths-ignore: ['**.md', '.wordpress-org/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: npm ci
      - run: npm run lint:js
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["8.1","8.3","8.4"]' || '["8.3"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"wp":"6.9","php":"8.1"},{"wp":null,"php":"8.3"}]' || '[{"wp":null,"php":"8.3"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - name: Versión de WordPress y PHP de la matriz
        run: |
          core='${{ matrix.wp }}'
          if [ -n "$core" ]; then core="\"WordPress/WordPress#$core\""; else core=null; fi
          echo "{\"core\": $core, \"phpVersion\": \"${{ matrix.php }}\"}" > .wp-env.override.json
      - run: npx wp-env start
      - run: composer test:integration

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"wp":"6.9","php":"8.1"},{"wp":null,"php":"8.3"}]' || '[{"wp":null,"php":"8.3"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Versión de WordPress y PHP de la matriz
        run: |
          core='${{ matrix.wp }}'
          if [ -n "$core" ]; then core="\"WordPress/WordPress#$core\""; else core=null; fi
          echo "{\"core\": $core, \"phpVersion\": \"${{ matrix.php }}\"}" > .wp-env.override.json
      - run: npx wp-env start
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.wp || 'latest' }}
          path: test-results/

  # Presupuesto de rendimiento de 09 §4 (sugerencias salientes p95 < 500 ms y entrantes < 800 ms con 10.000
  # entradas; memoria < 64 MB). Tarda unos minutos (siembra e indexa 10.000 entradas), así que, como la
  # matriz completa, solo corre al ejecutarlo a mano o al etiquetar una versión.
  perf:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx wp-env start
      - run: npx wp-env run cli wp rewrite structure '/%postname%/'
      - name: Sitio sintético de 10.000 entradas
        run: npx wp-env run cli wp eval-file wp-content/plugins/magiclinking-wordpress-plugin/tests/perf/seed.php 10000
      - name: Indexado
        run: npx wp-env run cli wp magic-linking index
      - name: Sugerencias salientes y entrantes
        run: npx wp-env run cli wp eval-file wp-content/plugins/magiclinking-wordpress-plugin/tests/perf/suggest.php 100 strict

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: magic-linking
          path: dist/magic-linking.zip
